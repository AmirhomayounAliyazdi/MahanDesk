name: Android & Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  RUST_VERSION: "stable"
  FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r26d"

jobs:
  # ==========================================
  # 1. تولید فایل‌های ارتباطی بین Rust و Flutter
  # ==========================================
  generate-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies for codegen
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter pub get & build_runner
        run: |
          cd flutter
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Generate Bridge
        run: |
          flutter_rust_bridge_codegen \
            --rust-input src/flutter_ffi.rs \
            --dart-output flutter/lib/generated_bridge.dart \
            --rust-output src/bridge_generated.rs \
            --class-name RustdeskImpl \
            --skip-deps-check

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            flutter/lib/*bridge*
            src/*bridge*

  # ==========================================
  # 2. ساخت نسخه اندروید (APK)
  # ==========================================
  build-android:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build openjdk-17-jdk-headless nasm pkg-config git curl zip unzip tar

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install Rust & Android target
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Download Bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Cache Android vcpkg & oboe dependencies
        id: cache-android-deps
        uses: actions/cache@v4
        with:
          path: |
            /opt/vcpkg/installed
            ~/oboe
          key: android-deps-arm64-${{ env.NDK_VERSION }}-v3

      - name: Build Android native dependencies (vcpkg & oboe)
        if: steps.cache-android-deps.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sudo rm -rf /opt/vcpkg
          sudo git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          sudo chown -R $USER:$USER /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          export VCPKG_ROOT=/opt/vcpkg
          /opt/vcpkg/vcpkg install --classic --allow-unsupported \
            libvpx:arm64-android \
            libyuv:arm64-android \
            opus:arm64-android \
            aom:arm64-android \
            "ffmpeg[core,avcodec,avformat,avutil]:arm64-android"
          bash flutter/build_android_deps.sh || true

      - name: Build Rust Library for Android (arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/vcpkg
        run: |
          cargo install cargo-ndk
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          bash flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/librustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MahanDesk-Android-arm64
          path: flutter/build/app/outputs/flutter-apk/*.apk

  # ==========================================
  # 3. ساخت نسخه ویندوز (EXE)
  # ==========================================
  build-windows:
    needs: [generate-bridge]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Download Bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Cache Windows vcpkg dependencies
        id: cache-win-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: win-vcpkg-x64-static-v2

      - name: Install vcpkg libraries for Windows
        if: steps.cache-win-vcpkg.outputs.cache-hit != 'true'
        run: |
          vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Build Rust Core DLL (librustdesk.dll)
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cargo build --release --features flutter --lib
          if [ -f target/release/rustdesk.dll ] && [ ! -f target/release/librustdesk.dll ]; then
            cp target/release/rustdesk.dll target/release/librustdesk.dll
          fi
          mkdir -p target/release/deps
          cp target/release/librustdesk.dll target/release/deps/ || true
          cp target/release/librustdesk.dll flutter/windows/ || true

      - name: Build Windows App
        shell: bash
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release
          cp ../target/release/librustdesk.dll build/windows/x64/runner/Release/ || true

      - name: Upload Windows Build (EXE & DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: MahanDesk-Windows-x64
          path: flutter/build/windows/x64/runner/Release/*
